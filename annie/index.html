<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ef6b35">
  <meta name="description" content="Venez célébrer l'anniversaire d'Annie le samedi 24 avril 2027 à 18 h, à Villedieu-les-Poêles.">
  <title>On fête ça ! — samedi 24 avril 2027 à 18 h</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #293d32;
      background: #ef6b35;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      --orange: #ef6b35;
      --orange-dark: #bd4725;
      --green: #315d42;
      --green-dark: #203d30;
      --paper: #fffaf0;
      --muted: #647064;
      --border: #e4d7bf;
      --yellow: #f5c64c;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 38px 18px;
      display: grid;
      place-items: center;
      background-color: var(--orange);
      background-image: url("resources/orange-dots.svg");
      background-repeat: repeat;
      background-size: 84px 78px;
      background-attachment: fixed;
    }

    .invitation {
      width: min(100%, 700px);
      overflow: hidden;
      padding: 54px clamp(22px, 7vw, 70px) 36px;
      border: 3px solid #fff;
      border-radius: 4px;
      background: var(--paper);
      box-shadow: 12px 12px 0 rgba(151, 54, 25, .26);
      text-align: center;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: -64px 0 28px;
      color: var(--orange-dark);
      font-family: "Brush Script MT", "Segoe Script", "URW Chancery L", cursive;
      font-size: 4.2rem;
      font-style: italic;
      font-weight: 700;
      line-height: 1.1;
      -webkit-text-stroke: 1px var(--paper);
      paint-order: stroke fill;
      text-shadow: 2px 3px 0 var(--green-dark), 0 0 8px rgba(32, 61, 48, .6);
      transform: rotate(-4deg);
    }

    .rule {
      width: 90px;
      height: 4px;
      margin: 26px auto;
      border: 0;
      background: var(--yellow);
    }

    .date-label {
      margin: 0 0 8px;
      color: var(--orange-dark);
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .date {
      margin: 0;
      color: var(--green-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.8rem;
      line-height: 1.35;
    }

    .countdown-title {
      margin: 26px 0 12px;
      color: var(--muted);
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .unit {
      display: grid;
      min-width: 66px;
      gap: 6px;
      padding: 12px 10px 10px;
      border: 1px solid var(--border);
      border-bottom: 4px solid var(--orange);
      border-radius: 3px;
      background: #fff;
    }

    .unit span {
      color: var(--green-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.8rem;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .unit small {
      color: var(--muted);
      font-size: .62rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .event-day {
      min-height: 1.5em;
      margin: 13px 0 0;
      color: var(--green);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.08rem;
      font-style: italic;
    }

    .event-day + .rule { margin-top: 16px; }

    .venue {
      margin: 0;
      color: var(--green-dark);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.35rem;
      line-height: 1.45;
    }

    .town {
      margin: 5px 0 19px;
      color: var(--muted);
      font-size: .95rem;
    }

    .venue-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .map-link {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border: 2px solid var(--green);
      border-radius: 3px;
      background: var(--green);
      color: #fff;
      font-size: .88rem;
      font-weight: 700;
      text-decoration: none;
      transition: background-color .18s ease, color .18s ease;
    }

    .map-link:hover { background: var(--green-dark); }
    .map-link:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }

    .website-link {
      background: transparent;
      color: var(--green-dark);
    }

    .website-link:hover { color: #fff; }

    .meadow {
      display: block;
      position: relative;
      z-index: 0;
      width: calc(100% + 40px);
      height: 190px;
      margin: -24px -20px 0;
      object-fit: cover;
      object-position: center 55%;
    }

    @media (max-width: 420px) {
      body { padding: 22px 12px; }
      .invitation { padding: 38px 18px 28px; }
      h1 {
        width: fit-content;
        max-width: 100%;
        margin: -56px auto 28px;
        padding: .08em .2em;
        font-size: clamp(1.75rem, 8vw, 2.3rem);
        white-space: nowrap;
      }
      .countdown { gap: 6px; }
      .unit { min-width: 0; flex: 1; padding-inline: 5px; }
      .unit span { font-size: 1.5rem; }
      .unit small { font-size: .55rem; }
      .meadow {
        width: calc(100% + 36px);
        height: 165px;
        margin: -20px -18px 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="invitation">
    <img class="meadow" src="resources/mont-saint-michel.png" alt="Coucher de soleil sur le Mont-Saint-Michel, au loin derrière un champ fleuri.">
    <h1>On fête ça&nbsp;!</h1>
    <hr class="rule">

    <p class="date-label">Mon anniversaire le</p>
    <p class="date"><time datetime="2027-04-24T18:00:00+02:00">Samedi 24 avril 2027<br>à 18 h</time></p>

    <p class="countdown-title">Le compte à rebours est lancé</p>
    <div class="countdown" id="countdown" role="timer" aria-label="Compte à rebours jusqu'au samedi 24 avril 2027 à 18 h">
      <div class="unit"><span id="days">--</span><small>Jours</small></div>
      <div class="unit"><span id="hours">--</span><small>Heures</small></div>
      <div class="unit"><span id="minutes">--</span><small>Minutes</small></div>
      <div class="unit"><span id="seconds">--</span><small>Secondes</small></div>
    </div>
    <p class="event-day" id="event-day" aria-live="polite"></p>

    <hr class="rule">

    <p class="date-label">Rendez-vous à</p>
    <p class="venue">l'Auberge St Vincent</p>
    <p class="town">50870 Le Parc</p>
    <div class="venue-links">
      <a class="map-link" href="https://www.google.com/maps/search/?api=1&amp;query=Auberge+St+Vincent+au+Parc%2C+Villedieu-les-Po%C3%AAles" target="_blank" rel="noopener noreferrer">
        Voir le lieu sur la carte
      </a>
      <a class="map-link website-link" href="https://www.laclefdecamp.fr/gites/1044/auberge-st-vincent-et-diligence-35pers-2-gites-jacuzzi-jeux/" target="_blank" rel="noopener noreferrer">
        Site de l’auberge
      </a>
    </div>

  </main>

  <script>
    const celebrationStart = new Date("2027-04-23T17:00:00+02:00").getTime();
    const eventStart = new Date("2027-04-24T18:00:00+02:00").getTime();
    const eventEnd = new Date("2027-04-25T19:00:00+02:00").getTime();
    const units = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };
    const eventDay = document.getElementById("event-day");
    const pad = value => String(value).padStart(2, "0");

    function updateCountdown() {
      const now = Date.now();

      if (now >= eventEnd) {
        Object.values(units).forEach(unit => { unit.textContent = "00"; });
        eventDay.textContent = "Le week-end est terminé. Merci d’avoir fêté cela ensemble !";
        return;
      }

      const remaining = Math.max(0, eventStart - now);
      units.days.textContent = Math.floor(remaining / 86400000);
      units.hours.textContent = pad(Math.floor(remaining / 3600000) % 24);
      units.minutes.textContent = pad(Math.floor(remaining / 60000) % 60);
      units.seconds.textContent = pad(Math.floor(remaining / 1000) % 60);
      eventDay.textContent = now >= celebrationStart ? "C’est le grand week-end !" : "";
    }

    updateCountdown();
    window.setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
