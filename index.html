<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Save the Date – Anniversaire mamie Fabou</title>
<style>
  :root { font-family: Georgia, "Times New Roman", serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #071a33 0%, #0e3a5e 40%, #1c6a94 70%, #3fa0c4 100%);
    overflow: hidden;
  }
  .scene { position: relative; width: 100%; max-width: 800px; height: 100vh; max-height: 900px; }

  /* Lune */
  .moon {
    position: absolute; left: 74%; top: 14%;
    width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e8f4fb 55%, #b9d9ec 100%);
    box-shadow: 0 0 60px 18px rgba(232, 244, 251, .35);
    animation: glow 7s ease-in-out infinite alternate;
  }
  @keyframes glow { from { box-shadow: 0 0 40px 10px rgba(232,244,251,.25); } to { box-shadow: 0 0 70px 22px rgba(232,244,251,.45); } }

  .skyline { position: absolute; bottom: 0; left: 0; width: 100%; height: 46%; }

  /* Reflets sur l'eau (Bosphore) */
  .water { position: absolute; bottom: 0; left: 0; width: 100%; height: 13%; overflow: hidden; }
  .water::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,.08) 0 2px, transparent 2px 9px);
    animation: ripple 5s linear infinite;
  }
  @keyframes ripple { from { transform: translateY(0); } to { transform: translateY(9px); } }

  /* Mouettes */
  .bird { position: absolute; color: #dceef9; opacity: .8; animation: drift 14s linear infinite; }
  @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(840px); } }
  .m1 { top: 20%; animation-duration: 16s; }
  .m2 { top: 26%; animation-duration: 20s; animation-delay: -6s; font-size: 14px; }
  .m3 { top: 16%; animation-duration: 24s; animation-delay: -12s; font-size: 12px; }

  /* Carte */
  .card {
    position: absolute; left: 50%; top: 42%;
    transform: translate(-50%, -50%);
    width: min(88%, 460px);
    background: rgba(6, 22, 42, 0.62);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(143, 205, 235, .6);
    border-radius: 18px;
    padding: 40px 32px;
    text-align: center;
    color: #eaf6fd;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: rise 1.4s ease-out both;
  }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, -42%); } to { opacity: 1; transform: translate(-50%, -50%); } }

  .eyebrow {
    font-family: "Trebuchet MS", sans-serif;
    letter-spacing: .45em; text-transform: uppercase;
    font-size: 12px; color: #9fd8f2; margin-bottom: 14px;
  }
  .title { font-size: 44px; line-height: 1.1; margin-bottom: 6px; font-style: italic; }
  .title .accent { color: #6fc6ea; }
  .age {
    font-size: 88px; font-weight: bold; color: #bfe6f8;
    line-height: 1; margin: 10px 0 4px;
    text-shadow: 0 4px 18px rgba(0,0,0,.5);
  }
  .age small { font-size: 26px; font-weight: normal; color: #eaf6fd; }
  .divider {
    width: 120px; height: 1px; margin: 18px auto;
    background: linear-gradient(90deg, transparent, #9fd8f2, transparent);
  }
  .date {
    font-family: "Trebuchet MS", sans-serif;
    font-size: 20px; letter-spacing: .12em;
  }
  .crescent { font-size: 22px; margin-top: 6px; letter-spacing: 10px; }

  .countdown {
    display: flex; justify-content: center; gap: 22px;
    margin-top: 4px;
  }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .unit span {
    font-family: "Trebuchet MS", sans-serif;
    font-size: 30px; font-weight: bold; color: #bfe6f8;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .unit small {
    font-family: "Trebuchet MS", sans-serif;
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: #6fc6ea;
  }

  /* Étoiles scintillantes */
  .star { position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #eaf6fd; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.9; } }
</style>
</head>
<body>
<div class="scene">
  <div class="moon"></div>

  <div class="star" style="left:10%; top:10%;"></div>
  <div class="star" style="left:22%; top:18%; animation-delay:-1s;"></div>
  <div class="star" style="left:55%; top:7%;  animation-delay:-2s;"></div>
  <div class="star" style="left:88%; top:28%; animation-delay:-.5s;"></div>
  <div class="star" style="left:70%; top:38%; animation-delay:-1.5s;"></div>
  <div class="star" style="left:15%; top:32%; animation-delay:-2.5s;"></div>

  <div class="bird m1">⌒⌒</div>
  <div class="bird m2">⌒⌒</div>
  <div class="bird m3">⌒⌒</div>

  <!-- Skyline : Sainte-Sophie et minarets -->
  <svg class="skyline" viewBox="0 0 800 340" preserveAspectRatio="xMidYMax meet">
    <defs>
      <linearGradient id="domeG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2e6f96"/>
        <stop offset="1" stop-color="#123a5c"/>
      </linearGradient>
      <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1b4f74"/>
        <stop offset="1" stop-color="#0b2740"/>
      </linearGradient>
      <linearGradient id="minG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#24587e"/>
        <stop offset="1" stop-color="#0b2740"/>
      </linearGradient>
    </defs>

    <!-- Ville lointaine -->
    <g fill="#12395c" opacity=".55">
      <rect x="0" y="250" width="800" height="90"/>
      <circle cx="90" cy="250" r="22"/>
      <rect x="68" y="250" width="44" height="40"/>
      <circle cx="730" cy="252" r="26"/>
      <rect x="704" y="252" width="52" height="45"/>
      <circle cx="200" cy="255" r="14"/>
      <rect x="186" y="255" width="28" height="35"/>
    </g>

    <!-- Sainte-Sophie -->
    <g>
      <!-- Minarets -->
      <g fill="url(#minG)">
        <path d="M118 340 L122 150 Q125 138 128 150 L132 340 Z"/>
        <rect x="116" y="196" width="20" height="7"/>
        <rect x="115" y="168" width="22" height="7"/>
        <path d="M125 148 L128 128 L131 148 Z" fill="#3fa0c4"/>
        <circle cx="128" cy="124" r="4" fill="#9fd8f2"/>

        <path d="M668 340 L672 150 Q675 138 678 150 L682 340 Z"/>
        <rect x="666" y="196" width="20" height="7"/>
        <rect x="665" y="168" width="22" height="7"/>
        <path d="M675 148 L678 128 L681 148 Z" fill="#3fa0c4"/>
        <circle cx="678" cy="124" r="4" fill="#9fd8f2"/>

        <path d="M188 340 L192 190 Q194 180 196 190 L200 340 Z"/>
        <rect x="187" y="228" width="18" height="6"/>
        <circle cx="196" cy="182" r="3.5" fill="#9fd8f2"/>

        <path d="M600 340 L604 190 Q606 180 608 190 L612 340 Z"/>
        <rect x="599" y="228" width="18" height="6"/>
        <circle cx="608" cy="182" r="3.5" fill="#9fd8f2"/>
      </g>

      <!-- Corps et dômes -->
      <g fill="url(#bodyG)">
        <rect x="200" y="270" width="400" height="70"/>
        <rect x="220" y="240" width="360" height="40"/>
        <!-- demi-dômes -->
        <path d="M200 270 Q200 225 260 225 Q320 225 320 270 Z" fill="url(#domeG)"/>
        <path d="M480 270 Q480 225 540 225 Q600 225 600 270 Z" fill="url(#domeG)"/>
        <!-- dôme central -->
        <path d="M280 245 Q280 150 400 150 Q520 150 520 245 Z" fill="url(#domeG)"/>
        <!-- dômettes -->
        <circle cx="290" cy="242" r="22" fill="url(#domeG)"/>
        <circle cx="510" cy="242" r="22" fill="url(#domeG)"/>
      </g>
      <!-- Croissant au sommet -->
      <g fill="#9fd8f2">
        <circle cx="400" cy="142" r="7"/>
        <path d="M265 252 L535 252 L535 258 L265 258 Z" opacity=".5"/>
      </g>
      <!-- Fenêtres éclairées -->
      <g fill="#ffd98a" opacity=".85">
        <rect x="380" y="176" width="9" height="26" rx="4"/>
        <rect x="396" y="176" width="9" height="26" rx="4"/>
        <rect x="412" y="176" width="9" height="26" rx="4"/>
        <rect x="300" y="240" width="8" height="20" rx="4"/>
        <rect x="492" y="240" width="8" height="20" rx="4"/>
        <rect x="238" y="248" width="7" height="18" rx="3"/>
        <rect x="555" y="248" width="7" height="18" rx="3"/>
      </g>
    </g>

    <!-- Mosquée bleue lointaine (6 minarets esquissés) -->
    <g fill="#16425f" opacity=".65">
      <circle cx="60" cy="262" r="30"/>
      <path d="M20 300 L22 208 Q24 198 26 208 L28 300 Z"/>
      <path d="M92 300 L94 208 Q96 198 98 208 L100 300 Z"/>
    </g>
  </svg>

  <div class="water"></div>

  <div class="card">
    <div class="eyebrow">Save the Date</div>
    <div class="title">Anniversaire <span class="accent">de Fabou</span></div>
    <div class="age">58 <small>ans</small></div>
    <div class="divider"></div>
    <div class="date">Samedi 26 Septembre</div>
    <div class="crescent">☾ ✦ ☾</div>
    <div class="divider"></div>
    <div class="countdown" id="countdown">
      <div class="unit"><span id="days">--</span><small>Jours</small></div>
      <div class="unit"><span id="hours">--</span><small>Heures</small></div>
      <div class="unit"><span id="minutes">--</span><small>Min</small></div>
      <div class="unit"><span id="seconds">--</span><small>Sec</small></div>
    </div>
  </div>
</div>
<script>
  const target = new Date("2026-09-26T19:00:00+02:00").getTime();
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    let diff = Math.max(0, target - Date.now());
    const d = Math.floor(diff / 86400000);
    const h = Math.floor(diff / 3600000) % 24;
    const m = Math.floor(diff / 60000) % 60;
    const s = Math.floor(diff / 1000) % 60;
    document.getElementById("days").textContent = d;
    document.getElementById("hours").textContent = pad(h);
    document.getElementById("minutes").textContent = pad(m);
    document.getElementById("seconds").textContent = pad(s);
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
